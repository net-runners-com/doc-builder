aspects:
  - id: evidence
    ask: 数値や断定的な主張に、根拠（出典 {{cite}}・表・計算）が示されているか。根拠のない数値・断定があれば fail。
    why_not_rule: "根拠の要否は文脈（主張の重さ・読者）で変わり、語や構文の規則では決まらないため"
  - id: vague-quantity
    ask: 「大幅に」「多数」「数件」など、定量化できるのに曖昧な表現で効果や規模を述べていないか。あれば fail。
    why_not_rule: "曖昧語の一覧（辞書）を持たない方針のため、文脈から定量化できるかを判断する必要がある"
