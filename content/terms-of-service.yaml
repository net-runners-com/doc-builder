# 欠陥: T2 未定義参照（refund）/ T3 定義語違反（ユーザー）/ T4 告知期間不足 / T5 不利条項（レビュー）
# T1（欠番）は自動採番のため発生しない
kind: terms
meta:
  title: ノートポケット 利用規約
  version: 2.0.0
  updated: 2026-08-15
  effective: 2026-09-01
  owner: 株式会社サンプルワークス 法務部
glossary:
  - term: 利用者
    avoid: [ユーザー, ユーザ, 会員]
preamble: 本規約は、株式会社サンプルワークス（以下「当社」）が提供する「ノートポケット」（以下「本サービス」）の利用条件を定めるものです。
articles:
  - id: definitions
    title: 定義
    clauses:
      - 「利用者」とは、本規約に同意のうえ本サービスを利用する個人または法人をいいます。
      - 「コンテンツ」とは、利用者が本サービスに登録したノート、添付ファイルその他一切の情報をいいます。
  - id: consent
    title: 規約への同意
    clauses:
      - 利用者は、本規約に同意したうえで本サービスを利用するものとします。
      - 利用者が未成年者である場合、法定代理人の同意を得たうえで本サービスを利用するものとします。
  - id: fees
    title: 料金および支払方法
    clauses:
      - 有料プランの料金は、当社が別途定める料金表のとおりとします。
      - 支払方法はクレジットカードまたは請求書払いとします。
      - 既に支払われた料金は、{{ref:refund}}に定める場合を除き返金しません。
  - id: prohibited
    title: 禁止事項
    clauses:
      - ユーザーは、法令または公序良俗に違反する行為をしてはなりません。
      - 利用者は、当社または第三者の知的財産権を侵害する行為をしてはなりません。
  - id: suspension
    title: サービスの停止
    clauses:
      - 当社は、システムの保守点検を行う場合、利用者に事前に通知することなく本サービスの全部または一部を停止できるものとします。
  - id: change
    title: 規約の変更
    notice_days: 30
    clauses:
      - 当社は、変更後の規約の効力発生日の{{notice_days}}日前までに本サービス上で告知することにより、本規約を変更できるものとします。
  - id: law
    title: 準拠法および管轄
    clauses:
      - 本規約は日本法に準拠し、本サービスに関する紛争は東京地方裁判所を第一審の専属的合意管轄裁判所とします。
supplement: 2026年9月1日 施行
