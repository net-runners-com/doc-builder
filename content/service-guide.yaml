# 欠陥: S1 表記ゆれ（ユーザ）/ S2 TBD / S3 リンク切れ
kind: guide
meta:
  title: ノートポケット サービス説明書
  version: 1.2.0
  updated: 2026-09-01
  owner: 株式会社サンプルワークス プロダクト部
glossary:
  - term: ユーザー
    avoid: [ユーザ, 会員]
sections:
  - id: overview
    title: サービス概要
    body:
      - ノートポケットは、チームでメモや議事録を共有するためのクラウドノートサービスです。ブラウザとスマートフォンアプリから利用でき、ユーザーは作成したノートをフォルダ単位で共有できます。
      - "{{img:dashboard}}"
  - id: audience
    title: 対象ユーザー
    body: 5〜50名規模のチーム、議事録や手順メモを一箇所にまとめたい部署、外部パートナーと資料を限定共有したいプロジェクトを想定しています。
  - id: features
    title: 主な機能
    body: [{ table: feature-list }]
  - id: pricing
    title: 料金プラン
    body:
      - { table: plans }
      - 年払いの場合は 2 か月分割引となります。
  - id: env
    title: 動作環境
    body: "ブラウザは Chrome、Edge、Safari、Firefox の最新版、iOS は 17 以上、Android は TBD です。"
  - id: support
    title: サポート
    body: 問い合わせ窓口は support@example.com、受付時間は平日 10:00〜18:00（土日祝・年末年始を除く）です。ビジネスプランは専任担当者によるオンボーディング支援があります。
  - id: security
    title: セキュリティ
    body: 通信はすべて TLS 1.2 以上、保存データは AES-256 で暗号化されます。詳細は[セキュリティホワイトペーパー](./security-whitepaper.md)を参照してください。
tables:
  - id: feature-list
    title: 機能一覧
    columns: [機能, 内容, 対象プラン]
    rows:
      - [ノート作成, Markdown 形式でノートを作成・編集, 全プラン]
      - [フォルダ共有, フォルダ単位で閲覧・編集権限を設定, 全プラン]
      - [外部共有リンク, 有効期限つきの閲覧専用リンクを発行, スタンダード以上]
      - [監査ログ, 操作履歴を 1 年間保存, ビジネス]
  - id: plans
    title: 料金プラン
    columns: [プラン, 月額（税込）, ユーザ数上限, ストレージ]
    rows:
      - [フリー, 0円, 3名, 1GB]
      - [スタンダード, 1名あたり 600円, 50名, 1名あたり 10GB]
      - [ビジネス, 1名あたり 1,200円, 無制限, 1名あたり 100GB]
images:
  - id: dashboard
    path: ./assets/dashboard.svg
    alt: ノートポケットのダッシュボード画面
    caption: "図{{n}} ダッシュボード"
