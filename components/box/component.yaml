description: 枠・余白・背景
container: true
regions: [cover, front, back, header, footer]
defaults: { padding: 8pt }
props:
  type: object
  additionalProperties: false
  properties:
    padding: { type: string, pattern: "^-?\\d+(\\.\\d+)?(mm|cm|pt|em|%|fr)$" }
    border: { type: string, pattern: "^-?\\d+(\\.\\d+)?(mm|cm|pt|em|%|fr)$" }
    fill: { enum: [background, surface, text, muted, primary, accent, border, grid, watermark], description: パレットのトークン名 }
    width: { type: string, pattern: "^-?\\d+(\\.\\d+)?(mm|cm|pt|em|%|fr)$" }
    children: { type: array }
