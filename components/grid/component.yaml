description: 子要素を格子状に並べる
container: true
regions: [cover, front, back, header, footer]
defaults: { gap: 8pt }
props:
  type: object
  additionalProperties: false
  required: [columns]
  properties:
    columns: { type: array, minItems: 1, items: { type: string, pattern: "^-?\\d+(\\.\\d+)?(mm|cm|pt|em|%|fr)$" } }
    gap: { type: string, pattern: "^-?\\d+(\\.\\d+)?(mm|cm|pt|em|%|fr)$" }
    children: { type: array }
